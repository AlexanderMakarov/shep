repairs:
  - title: Interactive development pages at numeric loopback addresses
    trigger: >-
      Next blocked development script requests opened through 127.0.0.1, leaving rendered pages
      without working client controls.
    result: >-
      Explicit numeric loopback development origins restore hydration. Browser checks use the
      user's 127.0.0.1 address instead of assuming localhost behaves identically.
  - title: Dark agent artwork and broken Cursor image
    trigger: Black monochrome artwork disappeared on the dark surface; Cursor failed to decode.
    result: >-
      A shared local-image component preserves colored artwork and inverts monochrome logos in
      dark mode. Both agent and editor consumers use it, with colocated stories and regression tests.
  - title: Mobile navigation and page reflow
    trigger: >-
      Phone navigation inherited collapsed desktop group behavior and stayed open after navigation;
      application panes and project controls were squeezed or overflowed.
    result: >-
      A mobile shell trigger, route-aware drawer dismissal, independent group expansion,
      full-width Conversation/Workspace switching and wrapping toolbars preserve reachable actions.
      A final production screenshot also exposed a 10px overlap between the canvas status pill
      and setup progress; mobile setup now reserves space below the pill.
  - title: Settings navigation and early clicks
    trigger: >-
      Section controls clipped on narrow screens, smooth jumps were interrupted by loading content,
      and an early toggle click was dropped before hydration with no settings save request.
    result: >-
      Named scrolling section navigation, stable jumps, responsive rows and a hydration guard keep
      controls reachable and disable actions until handlers are ready. The existing disabled-chat
      browser regression now confirms the setting takes effect.
  - title: Accessible headings, landmarks, labels and menus
    trigger: >-
      Real browser scans found nested main landmarks, invalid heading roles, unnamed sliders and
      filters, nested buttons, unnamed dialogs, missing tab-panel relationships and form controls
      inside menu containers without menu semantics.
    result: >-
      Native controls and headings, explicit accessible names, linked panels, proper menu items,
      keyboard menu navigation and larger dialog close targets repair the observed failures.
  - title: Theme contrast in populated and error states
    trigger: >-
      Muted opacity, success and warning labels, unscanned security status and dark error text
      failed contrast checks on their actual surfaces.
    result: >-
      Shared tokens and consumer colors now retain contrast in light and dark mode. Four new
      design-token tests fail on the old dark error palette and pass on the corrected palette.
  - title: Recoverable failed actions
    trigger: >-
      Rejected model loading, launch requests, authentication refreshes, memory saves/deletes and
      webhook refreshes either rejected without useful feedback or lost their recovery path.
    result: >-
      Focused RED/GREEN tests now verify error announcements, preserved data, loading completion
      and retry behavior. Cursor launch uses the catalog's tool ID.
