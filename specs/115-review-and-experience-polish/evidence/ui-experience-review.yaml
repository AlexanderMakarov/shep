limitations:
  - >-
    This is measured coverage of reachable routes, representative states and recorded interactions;
    automated accessibility checks and screenshots do not prove every possible state is flawless.
  - >-
    The zoom check uses the equivalent CSS viewport for the user's 130% screenshot, rather than
    automating the browser's zoom control.
  - >-
    Real paid LLM calls, cloud provisioning, production webhooks, operating-system tool installation,
    desktop packaging and authenticated third-party flows were not executed by this UI review.
  - >-
    Existing coming-soon providers and CLI-only workflow creation remain explicit product states.
    Gated workflow tests report a skip if the flag is disabled; this review enables it and requires
    no skipped browser scenarios.
  - >-
    CI for the fork PR still requires maintainer workflow approval. Local verification is recorded
    separately from GitHub's BLOCKED merge-state label.
