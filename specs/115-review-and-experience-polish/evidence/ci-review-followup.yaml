  browserRepeated: Ten editor round-trips and ten populated application menu scans passed with zero retries.
  messagingRegression: >-
    All 15 component tests pass, including the two initially failing draft-overwrite regressions
    and server-update coverage. Ten complete pairing flows and ten invalid-URL rejection flows
    pass against the rebuilt production release with zero retries. Release and Storybook builds pass.
  agentEditor: >-
    A navigation stall occurred once despite the increased cold-route budget. It did not recur
    in five consecutive traced runs or the final complete browser run, but both initial remote
    runs later reproduced it and passed only on retry. CI now targets the production release
    instead of rebuilding routes with the development server. Retry-only browser passes fail
    the job, and failed traces are retained and uploaded. No route assertion is removed or softened.
  qualityGates: Root and web typechecks, lint, format, story coverage and spec validation passed.
  composerStories: 274 of 340 components now have stories; the grandfathered baseline is reduced to 66.
