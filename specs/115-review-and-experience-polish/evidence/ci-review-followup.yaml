scope: Repair the four failed jobs and all actionable findings in the review.
repairs:
  - finding: Both Linux Electron builds rejected the scoped package name.
    change: Give the Linux executables explicit, distinct names, shep and shep-apps.
    proof: Both complete AppImage packaging commands succeeded locally.
  - finding: Seven Windows unit failures assumed POSIX paths and permissions.
    change: >-
      Use real temporary attachment paths and platform delimiters; compare filesystem-reported
      permission bits, retain POSIX-specific assertions where meaningful, and exercise portable
      directory-creation failure on every platform.
    proof: Affected suites pass locally; the Windows CI job is the platform-specific acceptance gate.
  - finding: Repository toolbar targets became too small at the default canvas zoom.
    change: >-
      Enlarge repository and session controls to 32 CSS pixels and tighten toolbar gaps. Add an
      independent standalone-repository fixture instead of depending on another test's leftovers.
    proof: >-
      New geometry assertions failed at 20.4 pixels before the repair. They now pass at the default
      zoom alongside the unchanged axe target-size rule in both themes.
  - finding: Repository dev configuration had no usable approval path.
    change: >-
      Add shep dev approve using the shared target resolver. Preview all executable fields and
      require --fingerprint to record consent. Re-read and compare before writing approval.
    proof: >-
      Four CLI regressions, a changed-command regression, all locale parity checks and a packaged
      CLI smoke test with spaces in the repository path pass. Preview writes no approval and
      approval executes no repository commands.
  - finding: Webhook authentication exceptions used raw prefix matching.
    change: >-
      Exempt only the two exact self-authenticating endpoints, including a trailing slash.
      Child paths never inherit the exemption, so no routing normalization assumption is needed.
    proof: >-
      Six new plain, encoded and backslash traversal/child-path regressions failed before the
      repair and now enforce both the token and Host gates.
  - finding: Setup command logs decoded UTF-8 independently per chunk.
    change: Use the shared line accumulator with independent stdout and stderr decoders.
    proof: Byte-by-byte interleaved Unicode and an unterminated error line fail before and pass after.
  - finding: Verdict parser prose and pnpm prerequisites were inaccurate.
    change: >-
      Document escalation for conflicting verdicts, repeated identical verdicts, and the pnpm
      minimum moving from 8 to 10 to match the pinned CI toolchain.
additionalBrowserRepairs:
  - Wait for settings saves before navigating away from the chat-toggle test.
  - Wait for language action responses; the old saving selector targeted the wrong section.
  - Give the first agent-editor navigation the existing cold-route timeout budget.
  - Wait for finite UI animations before measuring accessibility; keep every axe rule enabled.
  - Enable and restore the workflow flag through the UI so its accessibility case is exercised.
  - >-
    Keep the enabled agent picker readable while a workflow disables message composition.
    Remove inherited dimming from the composer, retain the individual disabled controls, and add
    colocated Storybook examples. The disabled-input and stop-action regressions remain green.
  - >-
    Repeated production scans also caught the asynchronously loaded picker midway through its
    enable transition, with a measured contrast ratio of 3.12. Wait for its enabled state before
    settling animations and scanning the populated page. Include axe failure summaries so future
    failures preserve the measured colors and ratio.
  - >-
    Isolate drawer clickability with explicit Implementation and Review feature fixtures. The
    full production suite caught the old test comparing a node's provisional name with its final
    agent-generated name in the drawer. Target stable feature IDs and require both drawers,
    including the second click that previously ran only when another feature happened to exist.
  - >-
    The strict fork browser gate exposed a messaging settings race: the enable-save response
    overwrote a freshly edited gateway URL and pairing used the old URL. Two deterministic unit
    regressions reproduce the overwrite. Synchronize fields independently and preserve unsaved
    gateway drafts while still accepting server updates to pristine fields. The browser test now
    waits for the actual rejection message before checking that pairing stayed closed.
