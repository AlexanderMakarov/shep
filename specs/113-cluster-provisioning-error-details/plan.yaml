name: "cluster-provisioning-error-details"
summary: >
  Close every gap where a cluster provisioning failure never reaches the existing
  `status: Error` + `errorMessage` terminal. The domain/UI plumbing for displaying
  `errorMessage` already works; this plan wires four independent failure paths into it:
  (1) worker-level uncaughtException/unhandledRejection handlers that today log and exit
  without persisting state, (2) a new `workerPid` column so worker liveness becomes
  checkable at all, (3) one `ReconcileStuckClusterUseCase` injected into the three
  cluster read paths (list/get/status) that detects a dead or hung worker on read and
  persists a distinguishing error message, and (4) native `execFile` timeouts on the two
  previously-unbounded CLI nodes (configure-kubectl, install-argocd) so hangs fail
  cleanly through the existing `handle-error` graph node instead of only being caught by
  the staleness backstop. All work follows Clean Architecture layering already
  established by the `AgentRun.pid`/`ShowAgentRunUseCase` and
  `ReconcileBlockedFeaturesUseCase` precedents identified in research — no new
  architectural idiom, transport, or `ClusterStatus` value is introduced.

relatedFeatures: []
technologies:
  - "TypeScript"
  - "TypeSpec (tsp) domain modeling"
  - "LangGraph (StateGraph) for the cluster-agent provisioning graph"
  - "Node.js child_process.fork()/execFile() for the cluster-agent worker and CLI wrappers"
  - "SQLite (better-sqlite3) persistence"
  - "Next.js App Router (API routes)"
  - "tsyringe (dependency injection)"
relatedLinks: []

phases:
  - id: phase-1
    name: "Domain & Persistence Foundation"
    description: >
      Add the `workerPid` field end-to-end (tsp -> codegen -> migration -> mapper ->
      repository INSERT/UPDATE lists) and the pure staleness constant/predicate in
      domain/shared. This unblocks every later phase since crash-handling, spawn-time
      persistence, and reconciliation all depend on `workerPid` existing on the entity
      and on a single source of truth for the staleness threshold. Comes first per
      LESSONS.md's "new column needs FOUR edits" pattern — get the column wiring right
      and verified with a repository round-trip test before any behavior is layered on
      top of it.
    parallel: false

  - id: phase-2
    name: "Worker Crash Handling"
    description: >
      Extract `persistWorkerCrash()` in cluster-agent-worker.ts and wire it into the
      `uncaughtException`/`unhandledRejection` process handlers (which currently log and
      `process.exit(1)` without ever updating the cluster record). Depends on phase 1
      only insofar as it reuses the same repository; it does not depend on `workerPid`
      itself, so it can proceed as soon as the entity/mapper/repository compile.
    parallel: false

  - id: phase-3
    name: "Worker PID Capture"
    description: >
      Persist the PID returned by `IClusterAgentProcessService.spawn()` onto the cluster
      record inside `ProvisionClusterUseCase.execute()`, immediately after spawn returns
      and with no intervening await that could race a crash. Depends on phase 1's
      `workerPid` column existing on the entity and repository.
    parallel: false

  - id: phase-4
    name: "Stuck-Cluster Reconciliation"
    description: >
      Introduce `ReconcileStuckClusterUseCase` and inject it into `ListClustersUseCase`,
      `GetClusterUseCase`, and `GetClusterStatusUseCase` so all three read paths
      (covering both the web UI's 3s poll and every CLI subcommand) reconcile identically
      before returning data. Depends on phase 1 (workerPid + staleness predicate) and
      benefits from phase 3 being in place so newly-provisioned clusters actually have a
      PID to check, though it must also handle pre-existing rows where `workerPid` is
      absent (NFR-5).
    parallel: false

  - id: phase-5
    name: "CLI Timeout Hardening"
    description: >
      Add `{ timeout: NODE_CLI_TIMEOUT_MS }` to every `execFile` call inside
      `K3dService.getKubeconfig()` and `ArgoCDService.install()`, so a hang inside
      configure-kubectl/install-argocd fails cleanly into `handle-error` with the CLI's
      real error text instead of only being caught later by the 180s staleness backstop.
      Independent of phases 2-4 (touches only infrastructure/services/{k3d,argocd}), so
      it could run in parallel with phase 4, but is sequenced last here to keep the task
      list linear and because it shares no files with the reconciliation work.
    parallel: false

  - id: phase-6
    name: "Integration Verification"
    description: >
      Write the integration tests the spec's success criteria explicitly require (forced
      unhandled exception/rejection, killed worker process, hung-but-alive worker
      process) per NFR-4's mandate that these be integration tests against real process
      lifecycle behavior, not mocks. Run the full local verification sequence
      (lint, format, typecheck, unit+integration tests, build, tsp) before considering
      the feature complete.
    parallel: false

