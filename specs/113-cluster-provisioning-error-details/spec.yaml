name: "cluster-provisioning-error-details"
number: 113
branch: "feat/113-cluster-provisioning-error-details"
oneLiner: "Surface the real cause when cluster provisioning stalls or fails instead of leaving the cluster stuck in \"Provisioning\" with no explanation"
summary: "The Cluster entity already has an `errorMessage` field and the web UI already renders it wherever a cluster's status is `Error`. The actual gap is upstream: several failure paths in the cluster-agent worker never transition status to `Error` at all, so the cluster is left in `Provisioning` forever with `errorMessage` unset and nothing in the UI to explain why. This feature closes those gaps — worker crash handling, stuck/dead-process detection, and richer error messages from the provisioning nodes — so every failure mode ends in an actionable, visible `errorMessage`.\n"
phase: "Requirements"
sizeEstimate: "M"
relatedFeatures: []
technologies:
  - "TypeScript"
  - "TypeSpec (tsp) domain modeling"
  - "LangGraph (StateGraph) for the cluster-agent provisioning graph"
  - "Node.js child_process.fork() for the cluster-agent worker"
  - "SQLite (better-sqlite3) persistence"
  - "Next.js App Router (API routes, Server Actions)"
  - "React / Tailwind (web UI components)"
  - "k3d / kubectl / Docker CLI wrappers (infrastructure services)"
relatedLinks: []
openQuestions:
  - question: "How should a dead/hung worker process (detected via PID liveness or heartbeat staleness) be reported to the user, versus a clean in-graph failure?"
    resolved: true
    options:
      - option: "Same errorMessage field, distinct text"
        description: "Reuse the existing `status: Error` + `errorMessage` contract. When staleness/dead-process detection fires, synthesize a clear message (e.g. \"Provisioning worker stopped responding (process no longer running) — last heartbeat at HH:MM:SS\") and write it through the same path the `handle-error` node uses. No new domain field, no new UI state — the existing three render sites (list card, detail drawer, useClusterEvents) work unchanged. Trade-off: the UI cannot visually distinguish \"clean provisioning failure\" from \"worker died silently\" unless the message text itself signals it.\n"
        selected: true
      - option: "New distinct ClusterStatus value (e.g. Stalled)"
        description: "Add a new enum value to `ClusterStatus` so stuck/dead-worker detection is a first-class state distinct from `Error`. Gives the UI a hook for different styling (e.g. a warning amber badge vs. a red error badge) and lets the CLI/API distinguish \"the provisioning logic failed\" from \"we lost contact with the worker and cannot say why it failed.\" Higher cost: touches the TypeSpec enum, every switch/case over `ClusterStatus` in the UI (badge component, filters, drawer), and adds a second thing consumers must handle everywhere `Error` is already handled.\n"
        selected: false
    selectionRationale: "The problem statement is explicit that the domain/UI plumbing for `errorMessage` already works end-to-end and needs no structural change — the bug is that some failure paths never populate it. Reusing the existing field/status keeps the fix scoped to \"make every failure path reach the existing terminal,\" which is both the smaller change and the one most consistent with the LangGraph `handle-error` pattern already in place. A new `ClusterStatus` value can be revisited later as a follow-up UX enhancement if users report needing to distinguish stuck-vs-failed at a glance, but it is not required to close the reported bug.\n"
    answer: "Same errorMessage field, distinct text"
  - question: "How should worker liveness/staleness be detected and surfaced: a passive check on each read (poll-triggered), or an active background reconciliation loop?"
    resolved: true
    options:
      - option: "Passive check on read (poll-triggered)"
        description: "Extend `GetClusterStatusUseCase`/`ListClustersUseCase` (or add a thin wrapping use case) to check `IClusterAgentProcessService.isAlive(workerPid)` and compare `lastHealthCheckAt` against a staleness threshold whenever a cluster in `Provisioning` is read, then persist `status: Error` + `errorMessage` at that moment before returning. Piggybacks on the existing 3s poll from `useClusterEvents()` — no new timers, schedulers, or background processes. Worst case, detection lags by one poll interval (~3s) after the worker actually died, which is acceptable for a UI that is itself only eventually consistent at 3s resolution.\n"
        selected: true
      - option: "Active background reconciliation loop"
        description: "Introduce a server-side interval/cron-like process that periodically scans all `Provisioning` clusters and reconciles worker liveness independent of whether anyone is viewing the UI. Detects staleness even with no active pollers (e.g. CLI-only usage, browser tab closed) and could notify (email/webhook) on stall. Requires new infrastructure (a scheduler, a long-running reconciliation service, lifecycle management for that service across CLI/web/TUI entry points) that does not exist today for any other entity in this codebase, and is a much larger surface to test and operate.\n"
        selected: false
    selectionRationale: "The codebase's existing real-time mechanism for cluster state is exclusively the 3s `useClusterEvents()` poll — there is no SSE/WebSocket/background-scheduler precedent for clusters (or features, per the summary's explicit call-out). Piggybacking staleness detection onto the existing read path satisfies the \"no new transport needed\" dependency already identified, keeps the change inside the application layer (a use case, per Clean Architecture rules), and avoids introducing lifecycle-management complexity for a background service that would need its own start/stop wiring across CLI, web, and TUI. If a user is not polling (e.g., cluster left running unattended with the browser closed), the CLI's `shep cluster status`/`list` commands still trigger the same passive check when next invoked.\n"
    answer: "Passive check on read (poll-triggered)"
  - question: "What staleness threshold should trigger 'worker likely dead' when the PID is not directly checkable (e.g. isAlive() is inconclusive) or as a secondary signal alongside isAlive()?"
    resolved: true
    options:
      - option: "180s since lastHealthCheckAt (3x health-check node's own timeout budget)"
        description: "`health-check.ts` already runs a 120s exponential-backoff loop before it would fail cleanly through the graph. A 180s staleness threshold gives that node a full opportunity to fail cleanly on its own before the read-path reconciliation second-guesses it, avoiding a race where reconciliation flags a cluster as stalled moments before the graph was about to report a clean, more specific error. 180s is short enough that a user polling every 3s still gets an answer within a couple of minutes of a genuine stall.\n"
        selected: true
      - option: "60s fixed threshold"
        description: "A tighter 60s threshold surfaces stalls faster, but is shorter than the 120s budget `health-check.ts` already legitimately uses for exponential backoff against a slow but healthy cluster — this would cause false positives (\"stalled\") on clusters that are still progressing normally through a slow health check, undermining trust in the error message.\n"
        selected: false
    selectionRationale: "Anchoring the threshold to a multiple of the longest already-legitimate in-graph wait (health-check's 120s) avoids false positives while still bounding user-visible latency to a couple of minutes. This value should live as a named constant (per the \"No Magic Values\" rule), not be inlined at call sites, so it can be tuned later without a scattered find/replace.\n"
    answer: "180s since lastHealthCheckAt (3x health-check node's own timeout budget)"
  - question: "Should configure-kubectl and install-argocd nodes get the same bounded-timeout discipline as health-check, as part of this feature or as a separate follow-up?"
    resolved: true
    options:
      - option: "In scope for this feature"
        description: "Audit both nodes now; if either can hang indefinitely on a CLI call with no timeout, add the same bounded-timeout + clean-failure-into-handle-error pattern `health-check.ts` already uses. Without this, the worker-crash-handling and PID-liveness fixes only cover hard crashes/kills — a node that hangs forever (process still alive, just stuck) would still leave the cluster silently parked in `Provisioning` past the staleness threshold without an `isAlive()` signal to catch it, defeating the feature's own goal of covering every failure mode.\n"
        selected: true
      - option: "Separate follow-up feature"
        description: "Ship only the crash-handling and liveness-detection fixes now, and file a follow-up for per-node timeout audits. Smaller immediate surface area, but leaves a known gap: a hung (not crashed) `configure-kubectl`/`install-argocd` call would only be caught by the staleness threshold via `lastHealthCheckAt` going stale — which does work as a backstop per the read-path reconciliation design — but the user gets a generic \"stopped responding\" message instead of the specific, actionable cause a bounded timeout could produce.\n"
        selected: false
    selectionRationale: "The feature's own problem statement explicitly lists this as an affected area (\"Need to confirm... and if missing, add\") and the whole premise of the feature is closing every gap that leaves a cluster silently stuck. The staleness-threshold backstop (question 3) still catches a true infinite hang, so this isn't a correctness blocker either way — but skipping it would mean shipping a feature titled \"surface the real cause\" that, for this specific failure mode, only ever surfaces a generic \"stopped responding\" instead of the actual CLI error. Keeping it in scope is a small incremental cost (add a timeout wrapper matching the existing `health-check.ts` pattern) for a meaningfully better error message.\n"
    answer: "In scope for this feature"
content: "## Problem Statement\n\nUsers report clusters getting \"stuck\" in `Provisioning` status with no indication of what went\nwrong. Investigation shows the domain and UI plumbing for error reporting already exist and\nwork correctly *when the cluster-agent graph reaches its error terminal node*:\n\n- `Cluster.errorMessage` (`tsp/domain/entities/cluster.tsp:139`) is a first-class field.\n- The graph's `handle-error` node (`packages/core/src/infrastructure/services/agents/cluster-agent/nodes/error.ts`)\n  persists `status: Error` + `errorMessage` whenever any node sets `state.error`.\n- The web UI already renders `errorMessage` in three places: the cluster list card\n  (`clusters-page-client.tsx:293`), the detail drawer overview tab\n  (`cluster-detail-drawer.tsx:183`), and it flows through `useClusterEvents()`\n  (`hooks/use-cluster-events.ts`), which polls `/api/clusters` every 3s.\n\nSo when a provisioning node fails cleanly (bad k3d binary, Docker not running, health-check\ntimeout, etc.), the user already sees a specific, translated error message. **The bug is that\nseveral realistic failure modes never reach that clean path**, leaving the cluster silently\nparked in `Provisioning`:\n\n1. **Global crash handlers don't update cluster status.** In\n   `cluster-agent-worker.ts`, `process.on('uncaughtException', ...)` and\n   `process.on('unhandledRejection', ...)` (lines 218-226) log to the worker's log file and call\n   `process.exit(1)` — but never call `clusterRepo.update(..., { status: Error, errorMessage })`.\n   Only the `try/catch` inside `runClusterWorker()` (lines 198-213) does that. Any error that\n   escapes the graph invocation via an unhandled promise rejection (plausible given\n   `k3dService`/`kubectlService`/`argoCdService` shell out to CLIs) leaves the cluster in\n   `Provisioning` forever with no `errorMessage`.\n\n2. **The spawned worker's PID is discarded, so nothing can detect a dead/hung worker.**\n   `ProvisionClusterUseCase.execute()` (`provision-cluster.use-case.ts:40`) calls\n   `this.processService.spawn(...)` and ignores the returned PID. `IClusterAgentProcessService`\n   already exposes `isAlive(pid)` (`cluster-agent-process-service.interface.ts:38`) — the same\n   primitive the feature-agent side presumably uses for liveness — but for clusters there is no\n   column to store the PID and no code path that ever calls `isAlive()`. A worker killed by\n   SIGKILL/OOM, or one that hangs indefinitely inside a native CLI call with no timeout\n   (`configure-kubectl`/`install-argocd` were not confirmed to have the same timeout discipline as\n   `health-check.ts`'s 120s exponential backoff), leaves `Provisioning` with a heartbeat\n   (`lastHealthCheckAt`) that simply stops advancing — and nothing ever notices.\n\n3. **No staleness/reconciliation check exists anywhere in the read path.** `GetClusterStatusUseCase`\n   and `ListClustersUseCase` both do a straight `clusterRepo.findById`/`list()` — neither compares\n   `lastHealthCheckAt`/`lastProvisionedAt` against \"now\" nor checks process liveness. The 3s poll\n   in `useClusterEvents()` is the natural place this reconciliation would surface, but there is\n   currently no use case for it to call.\n\n## Success Criteria\n\n- [ ] A cluster whose worker throws an unhandled exception or unhandled promise rejection\n      transitions to `status: Error` with a non-empty, human-readable `errorMessage` before the\n      worker process exits — verified with an integration test that forces both failure modes.\n- [ ] A cluster whose worker process is killed out-of-band (SIGKILL, OOM-killed, crashed without\n      running any exit handler) is detected as no-longer-alive and transitions to `status: Error`\n      with an `errorMessage` explaining the worker stopped responding, within one poll cycle\n      (~3s) after the read-path check next runs against that cluster.\n- [ ] A cluster whose worker hangs (process still alive, but `lastHealthCheckAt` has not advanced\n      past the staleness threshold) transitions to `status: Error` with an `errorMessage`\n      distinguishing \"stopped responding\" from a clean in-graph failure, without requiring the\n      worker process to be killed first.\n- [ ] `configure-kubectl` and `install-argocd` nodes are audited for unbounded CLI calls; any\n      found are wrapped with the same bounded-timeout pattern `health-check.ts` uses, so a hang\n      inside either node fails cleanly through `handle-error` with a specific message rather than\n      only being caught by the staleness backstop.\n- [ ] No existing passing test (unit, integration, or e2e) regresses.\n- [ ] `pnpm validate` (lint + format + typecheck + tsp) passes with zero errors.\n- [ ] The new persisted field (worker PID) round-trips correctly through create → read → update\n      for a cluster, verified by a repository-level test, per the \"settings column\" lesson\n      pattern in LESSONS.md.\n- [ ] No new Storybook stories are required and none are added, since no new UI surface or\n      component is introduced (display of `errorMessage` already exists and needs no structural\n      change).\n- [ ] The CLI (`shep cluster status` / equivalent) reflects the same `errorMessage` for a\n      stalled/crashed cluster as the web UI, with no CLI-specific logic duplicated — proving the\n      fix lives in the use-case layer per the \"presentation-agnostic core API\" rule.\n\n## Functional Requirements\n\n- **FR-1**: The cluster-agent worker's `uncaughtException` and `unhandledRejection` process\n  handlers MUST persist `status: Error` and a descriptive `errorMessage` to the cluster record\n  before calling `process.exit(1)`, using the same repository update path the `try/catch` in\n  `runClusterWorker()` already uses.\n- **FR-2**: `ProvisionClusterUseCase.execute()` MUST persist the PID returned by\n  `processService.spawn()` onto the cluster record at spawn time.\n- **FR-3**: The `Cluster` domain entity MUST gain a new optional field (e.g. `workerPid: number`)\n  defined in `tsp/domain/entities/cluster.tsp`, regenerated via `pnpm tsp:codegen`, with a\n  corresponding migration, mapper (`toDatabase`/`fromDatabase`), and explicit repository\n  INSERT/UPDATE column coverage.\n- **FR-4**: A use case (new or extended from `GetClusterStatusUseCase`/`ListClustersUseCase`)\n  MUST, for any cluster currently in `Provisioning`, check `IClusterAgentProcessService.isAlive(workerPid)`\n  and compare `lastHealthCheckAt` against the staleness threshold (180s) on each read, and if the\n  worker is dead or stale, persist `status: Error` + a descriptive `errorMessage` before returning\n  the cluster to the caller.\n- **FR-5**: The staleness/liveness check MUST depend only on the existing\n  `IClusterAgentProcessService` port — no direct `child_process` or OS-level process inspection\n  from the application layer.\n- **FR-6**: `errorMessage` values produced by crash-handling and staleness detection MUST be\n  distinguishable, human-readable text (not raw stack traces or generic \"Error\" strings) so users\n  can tell \"the worker died/hung\" apart from \"a specific provisioning step failed\" without a new\n  UI surface.\n- **FR-7**: `configure-kubectl.ts` and `install-argocd.ts` MUST be audited for CLI calls without a\n  bounded timeout; any found MUST be wrapped with the same timeout + clean-failure-into-`handle-error`\n  pattern already used by `health-check.ts`.\n- **FR-8**: All existing render sites for `errorMessage` (cluster list card, detail drawer,\n  `useClusterEvents()`) and the CLI's cluster status output MUST require no structural changes —\n  they inherit the fix automatically once the use-case layer reliably populates the field.\n\n## Non-Functional Requirements\n\n- **NFR-1 (Latency)**: A dead or hung worker MUST be surfaced to the user within one polling\n  interval (~3s) of the next `useClusterEvents()` poll or CLI status check after the staleness\n  threshold is crossed — no new background scheduler is introduced to reduce this further.\n- **NFR-2 (Consistency)**: The staleness threshold (180s) MUST be defined as a single named\n  constant, not duplicated or inlined across call sites, per the \"No Magic Values\" rule.\n- **NFR-3 (Architecture)**: All new logic MUST respect Clean Architecture layering — liveness\n  checks live behind `IClusterAgentProcessService` in the application layer; no infrastructure\n  imports leak into use cases; no business logic is added to presentation (web/CLI/TUI).\n- **NFR-4 (Testability)**: Worker crash-handling and staleness-detection logic MUST be covered by\n  integration tests that simulate a killed process and a hung-but-alive process, not unit tests\n  with mocks alone, since the failure modes being fixed are specifically about process lifecycle\n  behavior that mocks would trivially paper over.\n- **NFR-5 (Backward compatibility)**: Existing clusters created before the `workerPid` field\n  exists MUST continue to function — the field is optional, and staleness detection MUST degrade\n  gracefully (fall back to `lastHealthCheckAt`-only staleness) when `workerPid` is absent.\n- **NFR-6 (No new transport)**: The fix MUST NOT introduce SSE, WebSockets, or a background\n  scheduler/cron process — it reuses the existing 3s polling model already in place for clusters.\n\n## Product Questions & AI Recommendations\n\n| # | Question | AI Recommendation | Rationale |\n| - | -------- | ----------------- | --------- |\n| 1 | Should a dead/hung worker use the same `errorMessage` field with distinct text, or a new `ClusterStatus` value? | Same field, distinct text | Keeps the fix scoped to \"make every failure path reach the existing terminal\"; a new status value is a larger, separable UX enhancement. |\n| 2 | Should liveness/staleness be a passive check on read, or an active background reconciliation loop? | Passive check on read | Matches the existing 3s-poll-only architecture for clusters; avoids introducing new scheduler infrastructure with its own lifecycle. |\n| 3 | What staleness threshold should trigger \"worker likely dead\"? | 180s (3x health-check's own 120s budget) | Avoids false positives against health-check's legitimate exponential backoff while still bounding latency to a couple of minutes. |\n| 4 | Should `configure-kubectl`/`install-argocd` timeout hardening be in scope now or a follow-up? | In scope now | It's explicitly called out as an affected area and is required for the feature to actually cover \"every failure mode\" as promised, not just crashes. |\n\n## Affected Areas\n\n| Area | Impact | Reasoning |\n| ---- | ------ | --------- |\n| `packages/core/src/infrastructure/services/agents/cluster-agent/cluster-agent-worker.ts` | High | `uncaughtException`/`unhandledRejection` handlers must persist `status: Error` + a real `errorMessage` before exiting, mirroring the existing `catch` block and `SIGTERM` handler. |\n| `packages/core/src/application/use-cases/clusters/provision-cluster.use-case.ts` | High | Currently discards the PID returned by `processService.spawn()`; must persist it so liveness can later be checked. |\n| `tsp/domain/entities/cluster.tsp` + regenerated `output.ts` | Medium | Likely needs a new optional field (e.g. `workerPid`) to support liveness detection; requires a migration + mapper + repository INSERT/UPDATE updates per the \"settings column\" lesson pattern in LESSONS.md. |\n| `packages/core/src/infrastructure/persistence/sqlite/migrations/`, `mappers/cluster.mapper.ts`, `infrastructure/repositories/sqlite-cluster.repository.ts` | Medium | New column requires migration + mapper (`toDatabase`/`fromDatabase`) + explicit INSERT/UPDATE column lists — all three must stay in sync or writes silently drop the field (documented, recurring failure mode in this codebase). |\n| New/extended use case (e.g. `GetClusterStatusUseCase` or a new `DetectStuckClusterUseCase`) | High | No existing use case checks worker liveness or heartbeat staleness for clusters stuck in `Provisioning`; this is the core missing capability. Must depend on `IClusterAgentProcessService.isAlive()`, not infrastructure directly, per Clean Architecture rules. |\n| `src/presentation/web/app/api/clusters/route.ts` (and/or `[id]/status/route.ts`) | Medium | Natural point to invoke the new staleness-detection use case on each poll, since `useClusterEvents()` already hits this route every 3s. |\n| `packages/core/src/infrastructure/services/agents/cluster-agent/nodes/configure-kubectl.ts`, `install-argocd.ts` | Low-Medium | Need to confirm (and if missing, add) the same bounded-timeout discipline `health-check.ts` already has, so hangs inside these nodes fail fast into the error terminal instead of hanging the whole worker. |\n| `src/presentation/web/components/common/cluster-node/cluster-detail-drawer.tsx`, `clusters-page-client.tsx` | Low | Display logic for `errorMessage` already exists and needs no structural change — only benefits once the backend reliably populates the field. Distinct visual treatment for \"stuck\" vs. clean failure is explicitly deferred (see product question 1). |\n| CLI surface (`src/presentation/cli/commands/cluster/`) | Low | Should be checked for parity — if `shep cluster status` or similar reads `errorMessage`, it inherits the same fix for free once the use case layer is correct (per \"presentation-agnostic core API\" rule). |\n\n## Dependencies\n\n- Existing `Cluster.errorMessage` domain field and its persistence plumbing (no changes needed\n  to the field itself).\n- Existing `IClusterAgentProcessService` port (`isAlive`, `kill`) — reused, not replaced.\n- Existing LangGraph error-routing pattern (`routeOrError`, `handle-error` node) in\n  `cluster-agent-graph.ts` — the crash-handling fix must stay consistent with this pattern rather\n  than introduce a second error-reporting mechanism.\n- Existing 3s polling hook `useClusterEvents()` — the delivery mechanism for any new staleness\n  signal to the UI; no new transport (SSE, WebSocket) needed.\n- TDD/TypeSpec-first workflow: any new persisted field must go through `tsp/` → `pnpm tsp:codegen`\n  → migration → mapper → repository, per project mandatory rules.\n\n## Size Estimate\n\n**M** — This is not a UI feature (display of `errorMessage` already works) but a backend\nreliability fix spanning three layers: (1) worker-level crash handling for two previously\nunhandled failure paths, (2) a new persisted field (PID) with full migration/mapper/repository\nwiring, (3) a new or extended use case for liveness/staleness detection wired into the existing\npolling route, and (4) a timeout audit of two additional graph nodes. Each piece is individually\nsmall, but per LESSONS.md's recurring \"settings/entity column\" failure pattern, the column-wiring\nalone touches 4+ files that must stay in sync, and correctness requires new integration tests\nsimulating a killed/hung worker process — not just unit tests with mocks. No new UI surfaces or\nStorybook stories are required. Estimated at low-to-mid single-digit days, not hours (S) and not\na multi-week redesign (L/XL).\n\n---\n\n_Generated by feature agent — proceed with research_\n"
