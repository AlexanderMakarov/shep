content: |
  ## Architecture Overview

  ```
  SessionBootstrapper
    → IAgentExecutorFactory.createInteractiveExecutor(Cursor)
    → CursorInteractiveExecutor
         createSession  → spawn create-chat → chatId
         resumeSession  → wrap existing chatId
         handle.send(msg) + handle.stream()
           → spawn cursor-agent --yolo -p --output-format stream-json
                --stream-partial-output --resume <chatId> [--model …]
           → map NDJSON → InteractiveAgentEvent
    → AgentStreamConsumer (unchanged)
  ```

  Clean Architecture: new file stays in infrastructure/executors; application
  only sees IInteractiveAgentExecutor. No hardcoded Cursor outside the factory.

  ## Implementation Strategy

  1. RED tests for executor with fake spawn (create-chat stdout UUID; stream-json lines).
  2. GREEN minimal executor.
  3. RED factory tests for Cursor; GREEN factory branch.
  4. Docs pass.

  Extract shared Cursor helpers (model map, parseJsonLine, assistantText) only if
  duplication is painful — prefer small extract over large refactor of the one-shot executor.

  ## Testing Strategy (TDD: Tests FIRST)

  Unit tests with injected `SpawnFunction` fakes:
  - createSession runs `create-chat` and exposes sessionId
  - resumeSession does not call create-chat; first stream uses --resume
  - stream maps assistant / tool_call / result / error / partial deltas
  - abort/close terminates the active child process
  Factory unit + existing integration interactive checks updated for Cursor.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | sessionId empty until after first turn | create-chat returns UUID immediately; set sessionId before first send |
  | Double text (assistant + partial) | Skip full assistant text when partial deltas already emitted |
  | AskUserQuestion expected by UI | Out of scope; onUserQuestion unused; #895 for UX |
  | Windows prompt mangling | Reuse PowerShell + temp-file pattern from CursorExecutorService |
