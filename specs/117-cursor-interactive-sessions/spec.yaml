content: |
  ## Problem Statement

  Selecting Cursor as the default agent and opening Application chat fails because
  `AgentExecutorFactory.createInteractiveExecutor` only accepts `claude-code`.
  Cursor already supports scripted multi-turn via `cursor-agent create-chat`,
  `--print --output-format stream-json`, and `--resume <chatId>`. The gap is a
  durable `IInteractiveAgentExecutor` that Application chat can bootstrap and
  resume through the existing session lifecycle.

  ## Success Criteria

  - [ ] `factory.supportsInteractive(AgentType.Cursor)` returns `true`
  - [ ] `createInteractiveExecutor(AgentType.Cursor, …)` returns a working `IInteractiveAgentExecutor`
  - [ ] Session create allocates a chat id (`create-chat`) and expose it as `sessionId` after first turn (or immediately when known)
  - [ ] `resumeSession(chatId)` continues the same conversation via `--resume`
  - [ ] Stream events map to existing `InteractiveAgentEvent` types consumed by `AgentStreamConsumer`
  - [ ] RED-first unit tests cover factory wiring + executor create/resume/stream mapping
  - [ ] Docs no longer claim interactive is Claude-only without mentioning Cursor

  ## Out of Scope

  - AskUserQuestion / `onUserQuestion` parity with Claude SDK (Cursor `--yolo` auto-approves; no pause UX)
  - UX guard when agent lacks interactive support (#895)
  - Interactive support for other CLI agents (Codex, Gemini, Copilot, …)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Agent executors | High | New `CursorInteractiveExecutor` |
  | AgentExecutorFactory | Medium | Wire Cursor into supportsInteractive / createInteractiveExecutor |
  | Interactive session lifecycle | Low | Uses existing handle contract; no API changes |
  | Docs (adding-agent-types, agent-system) | Low | Update Claude-only wording |
  | Unit tests | High | Factory + executor TDD |

  ## Dependencies

  - Base branch: `feat/cursor-model-discovery-b` (PR #890) — model discovery / catalog code intersections
  - Existing: `IInteractiveAgentExecutor`, `SessionBootstrapper`, `CursorExecutorService` spawn/stream patterns

  ## Size Estimate

  **M** — New interactive executor + factory wiring + tests + docs. No TypeSpec or schema changes. Reuses Cursor CLI flags already proven in the one-shot executor.
